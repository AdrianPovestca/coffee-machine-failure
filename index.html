<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Machine Failure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div>

<header class="top">
  <div class="brand"><i></i>COFFEE MACHINE</div>
  <div class="pill"><i></i><b id="status">SYSTEM READY</b></div>
</header>

<section class="hero" id="hero">
  <div class="eyebrow">Small cafe, big problem</div>
  <h1>Make your<br>coffee.</h1>
  <p id="msg">One perfectly normal espresso.</p>
  <button id="go"><span>☕</span><b id="label">MAKE COFFEE</b><span>→</span></button>
</section>

<div id="fail"><small>SYSTEM FAILURE</small><h2>That went well.</h2><p>The coffee machine has chosen violence.</p></div>
<div id="foryou">THIS IS FOR YOU</div>
<div id="flash"></div>

<script type="module" src="script.js"></script>
</body>
</html>

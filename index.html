<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Machine Failure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div>

<header class="top">
  <div class="brand"><i></i>COFFEE MACHINE</div>
  <div class="pill"><i></i><b id="status">SYSTEM READY</b></div>
</header>

<section class="hero" id="hero">
  <div class="eyebrow">Small cafe, big problem</div>
  <h1>Make your<br>coffee.</h1>
  <p id="msg">One perfectly normal espresso.</p>
  <button id="go"><span>☕</span><b id="label">MAKE COFFEE</b><span>→</span></button>
</section>

<div id="fail"><small>SYSTEM FAILURE</small><h2>That went well.</h2><p>The coffee machine has chosen violence.</p></div>
<div id="foryou">THIS IS FOR YOU</div>
<div id="flash"></div>

<div id="diag" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:99;padding:12px 14px;background:#4a0d0d;color:#fff;font:12px/1.5 monospace;border-radius:8px;white-space:pre-wrap"></div>
<script>
(function () {
  var d = document.getElementById('diag');
  function show(m) { d.style.display = 'block'; d.textContent += m + '\n'; }
  addEventListener('error', function (e) {
    show('Eroare: ' + (e.message || ('nu s-a putut incarca ' + (e.target && (e.target.src || e.target.href)))));
  }, true);
  addEventListener('unhandledrejection', function (e) { show('Eroare: ' + e.reason); });
  setTimeout(function () {
    if (!window.__ok) show('Scena 3D nu a pornit. Verifica ca script.js este versiunea noua, apoi Cmd+Shift+R.');
  }, 3500);
})();
</script>
<script type="module" src="script.js?v=3"></script>
</body>
</html>
